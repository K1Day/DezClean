server {
    listen 80;
    server_name dezclean.com.kz www.dezclean.com.kz;

    # Let's Encrypt HTTP-01 challenge (must stay on plain HTTP for renewals)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dezclean.com.kz www.dezclean.com.kz;

    ssl_certificate     /etc/letsencrypt/live/dezclean.com.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dezclean.com.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /robots.txt { access_log off; }
    location = /sitemap.xml { access_log off; }

    # hashed build assets — safe to cache forever
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
